<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FSF – Tournament Generator</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Tournament Generator</h1>
        <div class="sub">Ger dystarskrá út frá valdum liðum.</div>
      </div>
    </header>
<h2 id="competitionTitle"></h2>
<p id="competitionVenue"></p>
    <div class="controls">
      <input id="competitionName" type="text" placeholder="Competition name">
      <input id="venue" type="text" placeholder="Vøllur">

      <select id="roundRobinType">
        <option value="1">Single Round Robin</option>
        <option value="2">Double Round Robin</option>
        <option value="3">Triple Round Robin</option>
      </select>

      <input id="maxRounds" type="number" min="1" placeholder="Max rounds" style="width:130px">

<input id="pitchCount" type="number" min="1" value="4" placeholder="Pitches" style="width:100px">

<input id="startTime" type="time" value="10:00">

<input id="matchMinutes" type="number" min="1" value="12" placeholder="Minutes" style="width:100px">

<input id="breakMinutes" type="number" min="0" value="3" placeholder="Break" style="width:100px">

      <label>
        <input id="concentrateSameClub" type="checkbox" checked>
        Concentrate same-club games
      </label>

      <label>
        <input id="preferAvoidSameClub" type="checkbox" checked>
        Prefer rounds without same-club games
      </label>

      <button onclick="generate()">Generate</button>
      <button onclick="exportExcel()">Export Excel</button>
      <button onclick="window.print()">Export PDF</button>
    </div>

    <p class="sub">Teams, one per line:</p>
    <textarea id="teamsInput" style="width:100%;min-height:180px;border-radius:14px;padding:12px;"></textarea>

    <p id="note"></p>

    <div class="tableWrap">
      <table id="tbl">
        <thead>
          <tr>
            <th>Umfar</th>
            <th>Heimalið</th>
            <th>Úrslit</th>
            <th>Útilið</th>
            <th>Vøllur</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="generator.js"></script>
  </div>
</body>
</html>
