name: Fetch FSF data

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Fetch matches -> docs/data/matches.json
        env:
          FSF_API_BASE: ${{ secrets.FSF_API_BASE }}
        run: python scripts/etl.py

      - name: Commit & push data
        env:
          GITHUB_TOKEN_PAT: ${{ secrets.GH_PAT_FSFDATA }}
        run: |
          git config user.name "fsf-bot"
          git config user.email "fsf-bot@users.noreply.github.com"

          git add docs/data/matches.json
          git commit -m "Update matches $(date -u +%F-%T)" || exit 0

          git remote set-url origin https://x-access-token:${GITHUB_TOKEN_PAT}@github.com/Fotboltssamband-Foroya/fsf-data-hub.git
          git push origin HEAD:main
