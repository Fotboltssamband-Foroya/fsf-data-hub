name: Fetch FSF matches

on:
  schedule:
    - cron: "30 4 * * *"   # daily 04:30 UTC
  workflow_dispatch: {}     # manual button

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Fetch matches -> docs/data/matches.json
        env:
          FSF_MATCHES_API_KEY: ${{ secrets.FSF_MATCHES_API_KEY }}
        run: python scripts/etl.py

      - name: Commit & push data
        run: |
          git config user.name "fsf-bot"
          git config user.email "fsf-bot@users.noreply.github.com"

          git add docs/data/matches.json
          git commit -m "Update matches $(date -u +%F-%T)" || exit 0

          git push origin HEAD:main
